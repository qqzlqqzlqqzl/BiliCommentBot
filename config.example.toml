# B站评论人工审核回复工具配置文件

# B站API配置
[bilibili]
# B站Cookie（从浏览器获取）
cookie = ""
# 刷新令牌（用于自动刷新Cookie）
refresh_token = ""
# 你的B站用户ID
uid = ""
# 检查评论的间隔时间（秒）
check_interval = 60
# 是否启用Cookie自动刷新
auto_refresh_cookie = true
# Cookie刷新检查间隔（分钟）
cookie_refresh_interval = 30
# 获取评论的最大页数
max_comment_pages = 2
# 获取视频的最大页数
max_video_pages = 10

# 请求频率控制配置
[rate_limit]
# 最小请求间隔（秒）
min_request_interval = 2.0
# 最大重试次数
max_retries = 3
# 重试基础延迟（秒）
retry_delay = 5

# 缓存配置
[cache]
# 缓存过期时间（秒）
expire_time = 300
# 是否启用缓存
enabled = true

# 视频列表缓存配置
[video_cache]
# 视频列表缓存时间（秒），默认12小时（43200秒）
expire_time = 43200
# 缓存文件路径
cache_file = "video_cache.json"

# 火山方舟豆包配置。API Key 建议通过 ARK_API_KEY 环境变量提供。
[ark]
api_key = ""
base_url = "https://ark.cn-beijing.volces.com/api/v3/responses"
model = "doubao-seed-2-1-turbo-260628"
max_tokens = 2400
system_prompt = "你是B站UP主的评论回复助手。只回复语境清楚、有互动价值、低误判风险的评论；回复要自然、简短、具体，不要客服腔，不要编造事实。"

# 回复配置
[reply]
# 是否启用后台自动生成审核草稿。无论此项是否开启，都不会自动发送。
enabled = true
# 回复前缀
prefix = "🤖 "
# 是否只回复未处理的评论
only_new = true
# 每次最多处理的评论数
max_process = 10
# 每批交给豆包判断的评论数
review_batch_size = 8
# 回复延迟（秒，避免频繁操作）
reply_delay = 2
# 生成回复时使用前N条评论作为上下文（0表示不使用上下文）
context_comments_count = 10
# 仅回复指定视频（留空则回复所有视频，填写BVID如BV1xx411c7mD则仅回复该视频）
only_bvid = ""
# 回复后是否点赞评论用户的最新视频
like_user_video_enabled = false
# 是否仅点赞关注了你的用户的视频（需要配置 uid）
like_user_video_only_followers = false
# 是否启用链式回复（楼中楼）
chained_reply_enabled = true
# 最大回复深度（层数），设置楼中楼回复的最大嵌套层数
max_reply_depth = 3

# 关键词过滤
[reply.keyword_filter]
# 启用关键词过滤
enabled = false
# 白名单关键词（逗号分隔），评论必须匹配才回复；留空则不限制
whitelist = ""
# 黑名单关键词（逗号分隔），匹配任一则跳过
blacklist = "广告,加我,微信"
# 白名单匹配模式：any（任一匹配）或 all（全部匹配）
mode = "any"
# 是否区分大小写
match_case = false

# 评论长度过滤
[reply.length_filter]
# 启用长度过滤
enabled = false
# 最短长度（0=不限制）
min_length = 2
# 最长长度（0=不限制）
max_length = 500

# 用户过滤
[reply.user_filter]
# 启用用户过滤
enabled = false
# 白名单 UID（逗号分隔），仅回复这些用户
whitelist = ""
# 黑名单 UID（逗号分隔），屏蔽这些用户
blacklist = ""

# 日志配置
[logging]
# 日志级别（DEBUG, INFO, WARNING, ERROR）
level = "INFO"
# 日志文件路径
file = "logs/bot.log"
# 是否输出到控制台
console = true

# 安全配置
[auth]
# 是否启用登录密码保护
enabled = false
# 登录密码（SHA-256哈希值，通过Web UI设置）
password = ""
