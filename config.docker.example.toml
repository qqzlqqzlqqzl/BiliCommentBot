# Docker 部署配置示例
# 首次启动会自动从本文件创建 config.toml 到 data 目录

# B站API配置
[bilibili]
# B站Cookie（从浏览器或WebUI获取）
cookie = ""
# 刷新令牌（用于自动刷新Cookie）
refresh_token = ""
# B站用户ID（扫码或验证登录后自动识别并写入，无需手填）
uid = ""
# 检查评论的间隔时间（秒）
check_interval = 3600
# 是否启用Cookie自动刷新
auto_refresh_cookie = true
# Cookie刷新检查间隔（分钟）
cookie_refresh_interval = 30
# 仅处理指定单个 BV 时，每个视频读取评论的最大页数
max_comment_pages = 10
# 获取视频的最大页数
max_video_pages = 10

# 请求频率控制配置
[rate_limit]
# 最小请求间隔（秒）
min_request_interval = 10.0
# 最大重试次数
max_retries = 3
# 重试基础延迟（秒）
retry_delay = 20

# 缓存配置
[cache]
# 缓存过期时间（秒）
expire_time = 300
# 是否启用缓存
enabled = true

# 视频列表缓存配置
[video_cache]
# 视频列表缓存时间（秒），默认12小时（43200秒）
expire_time = 43200
# 缓存文件路径（Docker模式下相对于 data 目录）
cache_file = "video_cache.json"

# 火山方舟豆包配置。容器中建议通过 ARK_API_KEY 环境变量提供。
[ark]
api_key = ""
base_url = "https://ark.cn-beijing.volces.com/api/v3/responses"
model = "doubao-seed-2-1-turbo-260628"
max_tokens = 128000
reasoning_effort = "medium"
request_interval_seconds = 0.15
max_concurrency = 16
max_retries = 5
retry_base_seconds = 2.0
system_prompt = "你是B站UP主的评论回复助手。只回复语境清楚、有互动价值、低误判风险的评论；回复要自然、简短、具体，不要客服腔，不要编造事实，同时不要显得太过幼稚，不要一直哈哈哈。"

# 回复配置
[reply]
# 是否启用当前账号的后台定时处理
enabled = true
# 是否只对后台定时轮次本轮新生成、豆包判断可回复的评论自动发送
auto_send_enabled = false
# 回复前缀
prefix = "🤖 "
# 是否只回复未处理的评论
only_new = true
# 每次最多处理的评论数
max_process = 500
# 可选：只读取此时间之后的评论，留空表示仅按条数限制
review_since = ""
# 是否连续 3 页没有新增待生成评论时提前停止
stop_after_empty_pages = true
# 每批交给豆包判断的评论数
review_batch_size = 8
# 回复延迟（秒，避免频繁操作）
reply_delay = 10
# 生成回复时使用前N条评论作为上下文（0表示不使用上下文）
context_comments_count = 10
# 是否在回复前先点赞评论
like_enabled = false
# 仅回复指定视频（留空则回复所有视频，填写BVID如BV1xx411c7mD则仅回复该视频）
only_bvid = ""
# 回复后是否点赞评论用户的最新视频
like_user_video_enabled = false
# 是否仅点赞关注了你的用户的视频（需要配置 uid）
like_user_video_only_followers = false
# 是否启用链式回复（楼中楼）
chained_reply_enabled = true
# 最大回复深度（层数），设置楼中楼回复的最大嵌套层数
max_reply_depth = 3

# 日志配置（Docker模式下日志存储在 data 目录下）
[logging]
# 日志级别（DEBUG, INFO, WARNING, ERROR）
level = "INFO"
# 日志文件路径（Docker模式下相对于 data 目录）
file = "logs/bot.log"
# 是否输出到控制台
console = true
